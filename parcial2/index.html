<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Mirasol</title>
</head>

<body>
    <header>
        <h1>Óptica Mirasol</h1>
        <p>Tu visión es nuestra prioridad. Atención personalizada y los mejores servicios ópticos.</p>
    </header>

    <main>
        <section>
            <h2>Agenda tu cita</h2>
            <p>Completa el formulario y te contactaremos para confirmar tu horario.</p>
        </section>

        <form id="form-cita" novalidate>
            <div>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div>
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div>
                <label for="consulta">Contanos qué necesitás:</label>
                <textarea id="consulta" name="consulta"></textarea>
            </div>

            <button type="submit">Pedir mi cita</button>

            <p id="aviso-cita" class="aviso"></p>
        </form>
    </main>

    <footer>
        Parcial 2 - Denilson Morales - 11 de agosto de 2026
    </footer>

    <script src="script.js"></script>
</body>

</html>
